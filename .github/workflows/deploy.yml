name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: hotel-reservation-microservice
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          export_default_credentials: true

      - name: Install docker-credential-gcr
        run: |
         gcloud components install docker-credential-gcr
         docker-credential-gcr configure-docker

      - name: Authenticate Docker to use asia.gcr.io
        run: gcloud auth configure-docker asia.gcr.io

      # Backend
      - name: Build backend Docker image
        run: docker build -t asia.gcr.io/hotel-reservation-microservice/hotel-backend ./Backend

      - name: Push backend Docker image
        run: docker push asia.gcr.io/hotel-reservation-microservice/hotel-backend

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy hotel-backend \
            --image asia.gcr.io/hotel-reservation-microservice/hotel-backend \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 5000

      #Frontend
      - name: Build frontend Docker image
        run: docker build -t asia.gcr.io/hotel-reservation-microservice/hotel-frontend ./frontend

      - name: Push frontend Docker image
        run: docker push asia.gcr.io/hotel-reservation-microservice/hotel-frontend

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy hotel-frontend \
            --image asia.gcr.io/hotel-reservation-microservice/hotel-frontend \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --port 3000
